<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Home Screen web-app behavior on iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Countdown" />
    <meta name="theme-color" content="#101418" />
    <link rel="icon" href="data:," />
    <title>Countdown</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800;900&family=Archivo Narrow:wght@600;700&display=swap" rel="stylesheet" />
    <style>
      :root {
        --bg: #f4f2ec;
        --surface: #fffdf8;
        --surface-2: #eceade;
        --ink: #16181d;
        --ink-soft: #565a63;
        --ink-faint: #8b8f98;
        --line: #ddd8ca;
        --accent: #e4572e;
        --accent-ink: #ffffff;
        --good: #1e7d4f;
        --shadow: 0 10px 30px rgba(22, 24, 29, 0.10);
        --radius: 18px;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #101418;
          --surface: #1a1f26;
          --surface-2: #232a33;
          --ink: #f2f0e9;
          --ink-soft: #a9aeb8;
          --ink-faint: #6e7480;
          --line: #2e3641;
          --accent: #ff6b3d;
          --accent-ink: #14100c;
          --good: #4cc38a;
          --shadow: 0 10px 30px rgba(0, 0, 0, 0.45);
        }
      }
      * { box-sizing: border-box; }
      html { -webkit-text-size-adjust: 100%; }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--ink);
        font-family: "Archivo", system-ui, -apple-system, "Segoe UI", sans-serif;
        line-height: 1.45;
        padding: env(safe-area-inset-top) 0 calc(96px + env(safe-area-inset-bottom));
      }
      .wrap { max-width: 620px; margin: 0 auto; padding: 20px 18px 0; }

      /* ---------- Hero: next event ---------- */
      .hero {
        background: var(--ink);
        color: var(--bg);
        border-radius: 26px;
        padding: 26px 24px 24px;
        box-shadow: var(--shadow);
        position: relative;
        overflow: hidden;
      }
      .hero .stripe {
        position: absolute; inset: 0 auto 0 0; width: 8px;
        background: var(--hero-color, var(--accent));
      }
      .hero .kicker {
        font-size: 12px; font-weight: 700; letter-spacing: 0.14em;
        text-transform: uppercase; opacity: 0.65; margin: 0 0 4px;
      }
      .hero h1 {
        font-size: 30px; line-height: 1.12; font-weight: 800;
        margin: 0 0 2px; letter-spacing: -0.01em;
        overflow-wrap: anywhere;
      }
      .hero .when { font-size: 15px; opacity: 0.75; margin: 0; }
      .hero .big {
        display: flex; align-items: baseline; gap: 10px; margin-top: 14px;
      }
      .hero .big .num {
        font-size: clamp(84px, 26vw, 128px); line-height: 0.95;
        font-weight: 900; letter-spacing: -0.03em;
        font-variant-numeric: tabular-nums;
      }
      .hero .big .unit { font-size: 22px; font-weight: 700; opacity: 0.8; }
      .hero .clock {
        display: flex; gap: 18px; margin-top: 14px; flex-wrap: wrap;
        font-variant-numeric: tabular-nums;
      }
      .hero .clock div { min-width: 52px; }
      .hero .clock b { display: block; font-size: 24px; font-weight: 800; line-height: 1; }
      .hero .clock span { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.6; }
      .hero .note { margin: 14px 0 0; font-size: 14px; opacity: 0.75; }
      .hero.today { background: var(--accent); color: #fff; }
      .hero-empty { text-align: left; }
      .hero-empty h1 { font-size: 28px; }
      .hero-empty p { opacity: 0.75; margin: 8px 0 0; font-size: 15px; max-width: 42ch; }

      /* ---------- Sections & cards ---------- */
      h2.section {
        font-size: 13px; font-weight: 700; letter-spacing: 0.13em;
        text-transform: uppercase; color: var(--ink-faint);
        margin: 30px 2px 12px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: var(--radius);
        padding: 16px 16px 14px;
        margin-bottom: 10px;
        display: flex; gap: 14px; align-items: flex-start;
        box-shadow: 0 1px 2px rgba(22,24,29,0.04);
      }
      .card .dot {
        flex: none; width: 12px; height: 12px; border-radius: 50%;
        margin-top: 7px; background: var(--c, var(--accent));
      }
      .card .main { flex: 1; min-width: 0; }
      .card .name { font-size: 17px; font-weight: 700; margin: 0; overflow-wrap: anywhere; }
      .card .date { font-size: 13.5px; color: var(--ink-soft); margin: 2px 0 0; }
      .card .note { font-size: 13.5px; color: var(--ink-soft); margin: 5px 0 0; }
      .card .count { text-align: right; flex: none; }
      .card .count b {
        display: block; font-size: 30px; line-height: 1; font-weight: 900;
        letter-spacing: -0.02em; font-variant-numeric: tabular-nums;
      }
      .card .count span { font-size: 11.5px; font-weight: 600; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 0.08em; }
      .card .count.today b { color: var(--accent); font-size: 22px; padding-top: 5px; }
      .card.past { opacity: 0.72; }
      .card .actions { display: flex; gap: 8px; margin-top: 10px; }
      .mini-btn {
        appearance: none; border: 1px solid var(--line); background: var(--surface-2);
        color: var(--ink); border-radius: 999px; padding: 0 14px;
        min-height: 38px; font: inherit; font-size: 13.5px; font-weight: 600; cursor: pointer;
      }
      .mini-btn.danger { color: #c22f16; border-color: #e5b6ab; }
      @media (prefers-color-scheme: dark) { .mini-btn.danger { color: #ff8a70; border-color: #5a342a; } }
      .mini-btn.armed { background: #c22f16; color: #fff; border-color: #c22f16; }

      .empty-note {
        border: 1.5px dashed var(--line); border-radius: var(--radius);
        padding: 22px 18px; color: var(--ink-soft); font-size: 15px; text-align: center;
      }

      /* ---------- Add button / sheet ---------- */
      .fab {
        position: fixed; left: 50%; transform: translateX(-50%);
        bottom: calc(18px + env(safe-area-inset-bottom));
        background: var(--accent); color: var(--accent-ink);
        border: none; border-radius: 999px; padding: 0 26px; min-height: 56px;
        font: inherit; font-size: 17px; font-weight: 800; cursor: pointer;
        box-shadow: 0 12px 28px rgba(228, 87, 46, 0.38);
        display: flex; align-items: center; gap: 8px; z-index: 40;
      }
      .fab:active { transform: translateX(-50%) scale(0.97); }

      .scrim {
        position: fixed; inset: 0; background: rgba(10, 12, 15, 0.5);
        opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 50;
      }
      .scrim.open { opacity: 1; pointer-events: auto; }
      .sheet {
        position: fixed; left: 0; right: 0; bottom: 0; z-index: 60;
        background: var(--surface); color: var(--ink);
        border-radius: 24px 24px 0 0; padding: 10px 20px calc(20px + env(safe-area-inset-bottom));
        transform: translateY(105%); transition: transform 0.28s cubic-bezier(0.32, 0.72, 0.24, 1);
        max-height: 92dvh; overflow-y: auto;
        max-width: 620px; margin: 0 auto;
      }
      .sheet.open { transform: translateY(0); }
      .sheet .grab { width: 44px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 14px; }
      .sheet h2 { margin: 0 0 16px; font-size: 21px; font-weight: 800; }
      .field { margin-bottom: 14px; }
      .field label { display: block; font-size: 13px; font-weight: 700; letter-spacing: 0.04em; margin-bottom: 6px; color: var(--ink-soft); }
      .field input, .field textarea {
        width: 100%; font: inherit; font-size: 16px; color: var(--ink);
        background: var(--surface-2); border: 1px solid var(--line);
        border-radius: 12px; padding: 12px 13px; min-height: 48px;
      }
      .field textarea { min-height: 64px; resize: vertical; }
      .field .hint { font-size: 12.5px; color: var(--ink-faint); margin-top: 5px; }
      .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
      .swatches { display: flex; gap: 10px; flex-wrap: wrap; }
      .swatches label { margin: 0; cursor: pointer; display: block; }
      .swatches input {
        appearance: none; -webkit-appearance: none;
        display: block; width: 40px; height: 40px; border-radius: 50%;
        margin: 0; cursor: pointer; border: none;
        outline: 2px solid transparent; outline-offset: 2px;
      }
      .swatches input:checked { outline-color: var(--ink); }
      .swatches input:focus-visible { outline-color: var(--accent); }
      .sheet .buttons { display: flex; gap: 10px; margin-top: 20px; }
      .btn-save {
        flex: 1; background: var(--accent); color: var(--accent-ink); border: none;
        border-radius: 14px; min-height: 52px; font: inherit; font-size: 16px; font-weight: 800; cursor: pointer;
      }
      .btn-cancel {
        background: var(--surface-2); color: var(--ink); border: 1px solid var(--line);
        border-radius: 14px; min-height: 52px; padding: 0 20px;
        font: inherit; font-size: 16px; font-weight: 700; cursor: pointer;
      }
      .form-error { color: #c22f16; font-size: 14px; font-weight: 600; margin: 4px 0 0; display: none; }

      /* ---------- How-to ---------- */
      .howto {
        margin-top: 34px; background: var(--surface); border: 1px solid var(--line);
        border-radius: var(--radius); padding: 18px;
      }
      .howto h2 { margin: 0 0 8px; font-size: 16px; font-weight: 800; }
      .howto ol { margin: 0; padding-left: 20px; color: var(--ink-soft); font-size: 14.5px; }
      .howto li { margin: 5px 0; }
      .howto li b { color: var(--ink); }
      footer { margin-top: 22px; text-align: center; color: var(--ink-faint); font-size: 12.5px; }

      @media (min-width: 700px) {
        .wrap { padding-top: 34px; }
        .hero h1 { font-size: 36px; }
      }
      @media (prefers-reduced-motion: reduce) {
        .sheet, .scrim { transition: none; }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <section id="hero" aria-live="polite"></section>

      <div id="upcoming-block">
        <h2 class="section" id="upcoming-heading">Coming up</h2>
        <div id="upcoming"></div>
      </div>

      <div id="past-block" hidden>
        <h2 class="section">Past</h2>
        <div id="past"></div>
      </div>

      <div class="howto">
        <h2>Put it on your Home Screen</h2>
        <ol>
          <li>Open this page in <b>Safari</b> on your iPhone.</li>
          <li>Tap the <b>Share</b> button (square with an arrow).</li>
          <li>Tap <b>Add to Home Screen</b>, then <b>Add</b>.</li>
        </ol>
      </div>

      <footer>Your events are saved on this device, in this browser.</footer>
    </div>

    <button class="fab" id="add-btn" type="button">＋ Add event</button>

    <div class="scrim" id="scrim"></div>
    <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="grab"></div>
      <h2 id="sheet-title">Add an event</h2>
      <form id="event-form" novalidate>
        <div class="field">
          <label for="f-name">Event name</label>
          <input id="f-name" type="text" placeholder="e.g. Japan trip, Mom's birthday" autocomplete="off" maxlength="80" />
        </div>
        <div class="row2">
          <div class="field">
            <label for="f-date">Date</label>
            <input id="f-date" type="date" />
          </div>
          <div class="field">
            <label for="f-time">Time <span style="font-weight:500">(optional)</span></label>
            <input id="f-time" type="time" />
          </div>
        </div>
        <div class="field">
          <label for="f-note">Note <span style="font-weight:500">(optional)</span></label>
          <textarea id="f-note" placeholder="Anything worth remembering about it" maxlength="200"></textarea>
        </div>
        <div class="field">
          <label>Color</label>
          <div class="swatches" id="swatches"></div>
        </div>
        <p class="form-error" id="form-error"></p>
        <div class="buttons">
          <button class="btn-cancel" type="button" id="cancel-btn">Cancel</button>
          <button class="btn-save" type="submit" id="save-btn">Save event</button>
        </div>
      </form>
    </div>

    <script>
      (function () {
        "use strict";
        var STORE_KEY = "countdown-events-v1";
        var COLORS = [
          { id: "ember", hex: "#e4572e" },
          { id: "ocean", hex: "#1f6fb4" },
          { id: "forest", hex: "#1e7d4f" },
          { id: "plum", hex: "#7c3aed" },
          { id: "gold", hex: "#c98a12" },
          { id: "rose", hex: "#d6336c" },
          { id: "slate", hex: "#5b6470" }
        ];

        var heroEl = document.getElementById("hero");
        var upcomingEl = document.getElementById("upcoming");
        var pastEl = document.getElementById("past");
        var pastBlock = document.getElementById("past-block");
        var upcomingBlock = document.getElementById("upcoming-block");
        var upcomingHeading = document.getElementById("upcoming-heading");

        var sheet = document.getElementById("sheet");
        var scrim = document.getElementById("scrim");
        var form = document.getElementById("event-form");
        var fName = document.getElementById("f-name");
        var fDate = document.getElementById("f-date");
        var fTime = document.getElementById("f-time");
        var fNote = document.getElementById("f-note");
        var formError = document.getElementById("form-error");
        var sheetTitle = document.getElementById("sheet-title");
        var saveBtn = document.getElementById("save-btn");
        var editingId = null;

        // Build color swatches
        var swWrap = document.getElementById("swatches");
        COLORS.forEach(function (c, i) {
          var lab = document.createElement("label");
          var inp = document.createElement("input");
          inp.type = "radio"; inp.name = "color"; inp.value = c.id;
          inp.style.background = c.hex;
          inp.setAttribute("aria-label", "Color " + c.id);
          if (i === 0) inp.checked = true;
          lab.appendChild(inp);
          swWrap.appendChild(lab);
        });

        function colorHex(id) {
          for (var i = 0; i < COLORS.length; i++) if (COLORS[i].id === id) return COLORS[i].hex;
          return COLORS[0].hex;
        }

        function load() {
          try {
            var raw = localStorage.getItem(STORE_KEY);
            var arr = raw ? JSON.parse(raw) : [];
            return Array.isArray(arr) ? arr : [];
          } catch (e) { return []; }
        }
        function save(events) {
          try { localStorage.setItem(STORE_KEY, JSON.stringify(events)); } catch (e) {}
        }

        function eventTime(ev) {
          // ev.date = "YYYY-MM-DD", ev.time = "HH:MM" or ""
          var parts = ev.date.split("-");
          var y = +parts[0], m = +parts[1] - 1, d = +parts[2];
          var hh = 0, mm = 0;
          if (ev.time) { var t = ev.time.split(":"); hh = +t[0]; mm = +t[1]; }
          return new Date(y, m, d, hh, mm, 0, 0).getTime();
        }
        function startOfDay(ts) {
          var d = new Date(ts);
          return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime();
        }
        function dayDiff(ev, now) {
          var a = startOfDay(now), b = startOfDay(eventTime(ev));
          return Math.round((b - a) / 86400000);
        }
        function fmtDate(ev) {
          var t = new Date(eventTime(ev));
          var s = t.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric", year: "numeric" });
          if (ev.time) s += " · " + t.toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
          return s;
        }
        function esc(s) {
          return String(s == null ? "" : s)
            .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
        }

        function render() {
          var now = Date.now();
          var events = load();
          var upcoming = [], past = [];
          events.forEach(function (ev) {
            var dd = dayDiff(ev, now);
            if (dd > 0 || (dd === 0 && eventTime(ev) >= now)) upcoming.push(ev);
            else if (dd === 0) upcoming.push(ev);
            else past.push(ev);
          });
          upcoming.sort(function (a, b) { return eventTime(a) - eventTime(b); });
          past.sort(function (a, b) { return eventTime(b) - eventTime(a); });

          renderHero(upcoming.length ? upcoming[0] : null, now);
          renderList(upcoming, past, now);
        }

        function renderHero(ev, now) {
          if (!ev) {
            heroEl.innerHTML =
              '<div class="hero hero-empty"><div class="stripe"></div>' +
              "<h1>Nothing on the calendar yet</h1>" +
              "<p>Add your first event below — a trip, a birthday, a deadline — and the days left will count down right here.</p></div>";
            return;
          }
          var dd = dayDiff(ev, now);
          var diff = eventTime(ev) - now;
          var isToday = dd === 0;
          var totalSec = Math.max(0, Math.floor(diff / 1000));
          var hh = Math.floor((totalSec % 86400) / 3600);
          var mm = Math.floor((totalSec % 3600) / 60);
          var ss = totalSec % 60;
          function pad(n) { return (n < 10 ? "0" : "") + n; }
          var html = '<div class="hero' + (isToday ? " today" : "") + '">' +
            '<div class="stripe" style="--hero-color:' + colorHex(ev.color) + '"></div>' +
            '<p class="kicker">' + (isToday ? "Today" : "Next up") + "</p>" +
            "<h1>" + esc(ev.name) + "</h1>" +
            '<p class="when">' + esc(fmtDate(ev)) + "</p>";
          if (isToday) {
            html += '<div class="big"><span class="num">0</span><span class="unit">days — it\'s today</span></div>';
          } else {
            html += '<div class="big"><span class="num">' + dd + '</span><span class="unit">' + (dd === 1 ? "day to go" : "days to go") + "</span></div>" +
              '<div class="clock">' +
              "<div><b>" + pad(hh) + "</b><span>hours</span></div>" +
              "<div><b>" + pad(mm) + "</b><span>mins</span></div>" +
              "<div><b>" + pad(ss) + "</b><span>secs</span></div>" +
              "</div>";
          }
          if (ev.note) html += '<p class="note">' + esc(ev.note) + "</p>";
          html += "</div>";
          heroEl.innerHTML = html;
        }

        function cardHTML(ev, now, isPast) {
          var dd = dayDiff(ev, now);
          var countHtml;
          if (isPast) {
            var ago = Math.abs(dd);
            countHtml = "<b>" + ago + '</b><span>' + (ago === 1 ? "day ago" : "days ago") + "</span>";
          } else if (dd === 0) {
            countHtml = '<div class="count today"><b>Today</b><span>&nbsp;</span></div>';
            return wrapCard(ev, countHtml, isPast);
          } else {
            countHtml = "<b>" + dd + '</b><span>' + (dd === 1 ? "day left" : "days left") + "</span>";
          }
          return wrapCard(ev, '<div class="count">' + countHtml + "</div>", isPast);
        }
        function wrapCard(ev, countHtml, isPast) {
          return '<article class="card' + (isPast ? " past" : "") + '">' +
            '<span class="dot" style="--c:' + colorHex(ev.color) + '"></span>' +
            '<div class="main">' +
            '<p class="name">' + esc(ev.name) + "</p>" +
            '<p class="date">' + esc(fmtDate(ev)) + "</p>" +
            (ev.note ? '<p class="note">' + esc(ev.note) + "</p>" : "") +
            '<div class="actions">' +
            '<button class="mini-btn" type="button" data-edit="' + ev.id + '">Edit</button>' +
            '<button class="mini-btn danger" type="button" data-del="' + ev.id + '">Delete</button>' +
            "</div></div>" + countHtml + "</article>";
        }

        function renderList(upcoming, past, now) {
          if (upcoming.length === 0 && past.length === 0) {
            upcomingBlock.style.display = "";
            upcomingHeading.textContent = "Your events";
            upcomingEl.innerHTML = '<div class="empty-note">No events yet. Tap <b>＋ Add event</b> to create your first countdown.</div>';
          } else if (upcoming.length === 0) {
            upcomingBlock.style.display = "none";
            upcomingEl.innerHTML = "";
          } else {
            upcomingBlock.style.display = "";
            upcomingHeading.textContent = upcoming.length > 1 ? "Coming up" : "Coming up";
            upcomingEl.innerHTML = upcoming.map(function (ev) { return cardHTML(ev, now, false); }).join("");
          }
          if (past.length) {
            pastBlock.hidden = false;
            pastEl.innerHTML = past.map(function (ev) { return cardHTML(ev, now, true); }).join("");
          } else {
            pastBlock.hidden = true;
            pastEl.innerHTML = "";
          }
        }

        // ---------- Sheet ----------
        function openSheet(ev) {
          editingId = ev ? ev.id : null;
          sheetTitle.textContent = ev ? "Edit event" : "Add an event";
          saveBtn.textContent = ev ? "Save changes" : "Save event";
          fName.value = ev ? ev.name : "";
          fDate.value = ev ? ev.date : "";
          fTime.value = ev ? (ev.time || "") : "";
          fNote.value = ev ? (ev.note || "") : "";
          var cid = ev ? ev.color : COLORS[0].id;
          var radios = form.querySelectorAll('input[name="color"]');
          radios.forEach(function (r) { r.checked = r.value === cid; });
          formError.style.display = "none";
          sheet.classList.add("open");
          scrim.classList.add("open");
          setTimeout(function () { fName.focus(); }, 300);
        }
        function closeSheet() {
          sheet.classList.remove("open");
          scrim.classList.remove("open");
          editingId = null;
        }
        document.getElementById("add-btn").addEventListener("click", function () { openSheet(null); });
        document.getElementById("cancel-btn").addEventListener("click", closeSheet);
        scrim.addEventListener("click", closeSheet);

        form.addEventListener("submit", function (e) {
          e.preventDefault();
          var name = fName.value.trim();
          var date = fDate.value;
          if (!name || !date) {
            formError.textContent = "Give the event a name and a date.";
            formError.style.display = "block";
            return;
          }
          var color = COLORS[0].id;
          var checked = form.querySelector('input[name="color"]:checked');
          if (checked) color = checked.value;
          var events = load();
          if (editingId) {
            events = events.map(function (ev) {
              if (ev.id === editingId) {
                return { id: ev.id, name: name, date: date, time: fTime.value || "", note: fNote.value.trim(), color: color };
              }
              return ev;
            });
          } else {
            events.push({
              id: "e" + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36),
              name: name, date: date, time: fTime.value || "", note: fNote.value.trim(), color: color
            });
          }
          save(events);
          closeSheet();
          render();
        });

        // Edit / delete (event delegation)
        document.addEventListener("click", function (e) {
          var editBtn = e.target.closest("[data-edit]");
          var delBtn = e.target.closest("[data-del]");
          if (editBtn) {
            var evs = load();
            for (var i = 0; i < evs.length; i++) {
              if (evs[i].id === editBtn.getAttribute("data-edit")) { openSheet(evs[i]); break; }
            }
          }
          if (delBtn) {
            if (delBtn.classList.contains("armed")) {
              var id = delBtn.getAttribute("data-del");
              save(load().filter(function (ev) { return ev.id !== id; }));
              render();
            } else {
              delBtn.classList.add("armed");
              delBtn.textContent = "Tap again to delete";
              setTimeout(function () {
                delBtn.classList.remove("armed");
                delBtn.textContent = "Delete";
              }, 3000);
            }
          }
        });

        render();
        setInterval(render, 1000);
      })();
    </script>
  </body>
</html>
